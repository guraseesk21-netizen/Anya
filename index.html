<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anya's Quiz 🥜</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffebee; /* Rosa chiaro tinta unita */
      padding: 15px;
      position: relative;
      overflow: hidden;
    }

    /* Sticker Arachide sparsi sullo sfondo */
    .bg-peanut {
      position: absolute;
      width: 45px;
      height: auto;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
    .p-1 { top: 5%; left: 8%; transform: rotate(-15deg); }
    .p-2 { top: 12%; right: 10%; transform: rotate(20deg); }
    .p-3 { top: 50%; left: 4%; transform: rotate(45deg); }
    .p-4 { bottom: 15%; right: 6%; transform: rotate(-30deg); }
    .p-5 { bottom: 6%; left: 12%; transform: rotate(10deg); }

    /* Container Principale */
    .game-card {
      position: relative;
      z-index: 10;
      background: transparent;
      width: 100%;
      max-width: 380px;
      min-height: 85vh;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* Pulsante Musica Audio */
    .music-btn {
      position: absolute;
      top: 0px;
      right: 5px;
      z-index: 20;
      background: #fff;
      border: 2px solid #ffccd5;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 3px 8px rgba(220, 120, 150, 0.15);
    }

    /* Header Logo Grande e Centrato */
    .header-logo {
      width: 100%;
      text-align: center;
      margin-top: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-logo img.logo-img {
      width: 90%;
      max-width: 320px;
      max-height: 160px;
      object-fit: contain;
      background: transparent;
    }

    /* Pagine */
    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      text-align: center;
    }

    .screen.active {
      display: flex;
    }

    /* Anya Vestita da Arachide (Schermata Principale) */
    .anya-peanut-hero {
      width: 175px;
      height: auto;
      object-fit: contain;
      margin: 20px 0;
      background: transparent;
    }

    /* Tasto Play Grafico e Pulsanti Più Chiari */
    .play-btn-img {
      width: 140px;
      cursor: pointer;
      transition: transform 0.2s ease;
      margin-top: 10px;
      background: transparent;
    }

    .play-btn-img:hover {
      transform: scale(1.08);
    }

    .play-btn-fallback {
      background: #ff85a2; /* Rosa più chiaro e luminoso */
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 133, 162, 0.4);
      transition: background 0.2s;
    }

    .play-btn-fallback:hover {
      background: #ff9ebb;
    }

    /* Schermata INTRO */
    .intro-text-box {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #ffccd5;
      border-radius: 18px;
      padding: 15px;
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .anya-character {
      width: 160px;
      height: auto;
      max-height: 180px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    /* Griglia Risposte A B C D */
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }

    .answer-btn {
      background: #ffffff;
      border: 2px solid #ffccd5;
      border-radius: 14px;
      padding: 14px 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #ff6584; /* Testo rosa chiaro ben visibile */
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
    }

    .answer-btn:hover {
      background: #fff0f3;
      transform: translateY(-2px);
    }

    /* Anya in Basso a Sinistra + Fumetto Staccato */
    .dialogue-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }

    .anya-avatar-standalone {
      width: 95px;
      height: 95px;
      object-fit: contain;
      background: transparent;
      flex-shrink: 0;
    }

    .speech-bubble-standalone {
      position: relative;
      background: #ffffff;
      border: 2px solid #ffccd5;
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 0.88rem;
      color: #444;
      text-align: left;
      line-height: 1.35;
      box-shadow: 0 4px 12px rgba(220, 120, 150, 0.12);
      flex-grow: 1;
      margin-bottom: 10px;
    }

    .speech-bubble-standalone::after {
      content: '';
      position: absolute;
      left: -10px;
      bottom: 15px;
      border-width: 8px 10px 8px 0;
      border-style: solid;
      border-color: transparent #ffffff transparent transparent;
      display: block;
      width: 0;
      z-index: 1;
    }

    .speech-bubble-standalone::before {
      content: '';
      position: absolute;
      left: -13px;
      bottom: 14px;
      border-width: 9px 11px 9px 0;
      border-style: solid;
      border-color: transparent #ffccd5 transparent transparent;
      display: block;
      width: 0;
      z-index: 0;
    }

    /* Immagini Risposta Corretta / Sbagliata */
    .feedback-img {
      width: 180px;
      height: auto;
      max-height: 200px;
      object-fit: contain;
      background: transparent;
      margin: 15px 0;
    }

    .reward-img {
      width: 160px;
      height: auto;
      object-fit: contain;
      background: transparent;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <!-- Sticker Arachide Sparsi nello Sfondo -->
  <img src="Arachide.png" class="bg-peanut p-1" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-2" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-3" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-4" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-5" alt="Arachide BG">

  <div class="game-card">

    <!-- Tasto Musica -->
    <button class="music-btn" onclick="toggleAudio()">🎵</button>

    <!-- Header Logo Grande e Centrato -->
    <div class="header-logo">
      <img src="logo.png" class="logo-img" alt="Logo" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
      <h1 id="alt-title" style="display:none; color:#ff85a2; font-size:2.2rem;">Anya's Quiz 🥜</h1>
    </div>

    <!-- ================= SCHERMATA 1: START ================= -->
    <div id="screen-start" class="screen active">
      
      <!-- Anya Vestita da Arachide al Centro -->
      <img src="Anya_aracidi.png" class="anya-peanut-hero" alt="Anya Arachide">

      <!-- Tasto Play -->
      <img src="play_button.png" class="play-btn-img" alt="Play" onclick="startIntro()" onerror="this.style.display='none'; document.getElementById('fallback-play').style.display='block';">
      <button id="fallback-play" class="play-btn-fallback" style="display:none; margin-top:15px;" onclick="startIntro()">PLAY ▶</button>
    </div>

    <!-- ================= SCHERMATA 2: INTRO ================= -->
    <div id="screen-intro" class="screen">
      <img src="anya_happy.png" class="anya-character" alt="Anya" onerror="this.src='https://via.placeholder.com/150/ffb6c1/ffffff?text=Anya'">
      
      <div class="intro-text-box">
        Waku Waku! Aiuta Anya a rispondere correttamente a tutte e 10 le domande per conquistare il premio finale! 🥜
      </div>

      <button class="play-btn-fallback" style="font-size: 1rem; padding: 10px 30px;" onclick="startGame()">Inizia!</button>
    </div>

    <!-- ================= SCHERMATA 3: DOMANDE ================= -->
    <div id="screen-quiz" class="screen">
      
      <!-- Risposte A B C D -->
      <div class="answers-grid">
        <button class="answer-btn" onclick="checkAnswer(0)">A: <span id="opt-0"></span></button>
        <button class="answer-btn" onclick="checkAnswer(1)">B: <span id="opt-1"></span></button>
        <button class="answer-btn" onclick="checkAnswer(2)">C: <span id="opt-2"></span></button>
        <button class="answer-btn" onclick="checkAnswer(3)">D: <span id="opt-3"></span></button>
      </div>

      <!-- Anya in Basso a Sinistra + Fumetto Staccato -->
      <div class="dialogue-wrapper">
        <img id="anya-expression" src="anya_talking.png" class="anya-avatar-standalone" alt="Anya" onerror="this.src='https://via.placeholder.com/95/ffb6c1/ffffff?text=Anya'">
        <div class="speech-bubble-standalone" id="question-text">
          Caricamento...
        </div>
      </div>

    </div>

    <!-- ================= SCHERMATA 4: RISPOSTA CORRETTA ================= -->
    <div id="screen-correct" class="screen">
      <h2 style="color: #4caf50;">Risposta Corretta! ✨</h2>
      <img id="correct-char-img" src="" class="feedback-img" alt="Personaggio" onerror="this.src='https://via.placeholder.com/170/ffb6c1/ffffff?text=Bravo!'">
      <p style="font-size: 0.9rem; color: #555; margin-bottom: 12px;">Ottimo lavoro!</p>
      <button class="play-btn-fallback" style="font-size: 0.9rem; padding: 10px 24px;" onclick="nextQuestion()">Prossima Domanda ▶</button>
    </div>

    <!-- ================= SCHERMATA 5: RISPOSTA SBAGLIATA ================= -->
    <div id="screen-wrong" class="screen">
      <h2 style="color: #ff6584;">Sbagliato... 😭</h2>
      <img src="anya_crying.png" class="feedback-img" alt="Anya Piange" onerror="this.src='https://via.placeholder.com/170/ffd1dc/ff4d73?text=Anya+Piange'">
      <p style="font-size: 0.9rem; color: #555; margin-bottom: 12px;">Riprova per Anya!</p>
      <button class="play-btn-fallback" style="font-size: 0.9rem; padding: 10px 24px;" onclick="retryQuestion()">Riprova ↺</button>
    </div>

    <!-- ================= SCHERMATA 6: VITTORIA ================= -->
    <div id="screen-win" class="screen">
      <h2 style="color: #ff85a2;">Vittoria! 🎉</h2>
      <p style="font-size: 0.9rem; color: #555; margin-top: 5px;">Hai superato tutte le 10 domande!</p>
      
      <img src="Arachide.png" class="reward-img" alt="Arachide Premio">
      
      <p style="font-size: 0.95rem; font-weight: bold; color: #d97706;">Hai vinto un pacchetto di arachidi!</p>
      
      <button class="play-btn-fallback" style="margin-top: 15px; font-size: 0.9rem; padding: 10px 24px;" onclick="goToScreen('screen-start')">Rigioca ↺</button>
    </div>

  </div>

  <audio id="bg-music" src="relax_music.mp3" loop></audio>

  <script>
    const questions = [
      {
        question: "Qual è il cibo preferito in assoluto di Anya?",
        options: ["Carote", "Arachidi 🥜", "Cioccolato", "Torta"],
        correct: 1,
        image: "Arachide.png"
      },
      {
        question: "Come si chiama il grande cane bianco della famiglia Forger?",
        options: ["Bond 🐶", "Max", "Peanut", "Loid"],
        correct: 0,
        image: "img_bond.png"
      },
      {
        question: "Qual è il potere segreto di Anya?",
        options: ["Super forza", "Sa volare", "Legge la mente 🧠", "Invisibilità"],
        correct: 2,
        image: "img_telepatia.png"
      },
      {
        question: "Come si chiama la prestigiosa scuola frequentata da Anya?",
        options: ["UA Academy", "Eden Academy 🏫", "Ouka Academy", "PK Academy"],
        correct: 1,
        image: "img_eden.png"
      },
      {
        question: "Qual è il nome in codice da spia di Loid Forger?",
        options: ["Thorn Princess", "Scruffy", "Twilight 🕵️‍♂️", "Daybreak"],
        correct: 2,
        image: "img_twilight.png"
      },
      {
        question: "Di che colore sono i capelli di Anya?",
        options: ["Biondi", "Rosa 💖", "Neri", "Castani"],
        correct: 1,
        image: "Capelli.png"
      },
      {
        question: "Cosa vuole collezionare Anya a scuola per rendere fiero Loid?",
        options: ["Stelle Stella ⭐", "Medaglie", "Punti premio", "Peluche"],
        correct: 0,
        image: "img_stella.png"
      },
      {
        question: "Come si chiama la migliore amica e compagna di classe di Anya?",
        options: ["Yor", "Fiona", "Becky 🎀", "Camilla"],
        correct: 2,
        image: "img_becky.png"
      },
      {
        question: "Cosa dice sempre Anya quando è super entusiasta?",
        options: ["Nani?!", "Waku Waku! ✨", "Sugoi!", "Baka!"],
        correct: 1,
        image: "img_wakuwaku.png"
      },
      {
        question: "Come chiama Anya suo padre Loid quando gli parla?",
        options: ["Papà", "Chichi 👨‍👧", "Loid", "Signore"],
        correct: 1,
        image: "img_chichi.png"
      }
    ];

    let currentQuestion = 0;
    let isMusicPlaying = false;
    const bgMusic = document.getElementById('bg-music');

    function toggleAudio() {
      if (isMusicPlaying) {
        bgMusic.pause();
        isMusicPlaying = false;
      } else {
        bgMusic.play().catch(() => {});
        isMusicPlaying = true;
      }
    }

    function goToScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startIntro() {
      if (!isMusicPlaying) toggleAudio();
      goToScreen('screen-intro');
    }

    function startGame() {
      currentQuestion = 0;
      goToScreen('screen-quiz');
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question-text').textContent = q.question;
      
      for(let i = 0; i < 4; i++) {
        document.getElementById(`opt-${i}`).textContent = q.options[i];
      }

      document.getElementById('anya-expression').src = "anya_talking.png";
    }

    function checkAnswer(selectedIndex) {
      const q = questions[currentQuestion];

      if(selectedIndex === q.correct) {
        document.getElementById('correct-char-img').src = q.image;
        goToScreen('screen-correct');
      } else {
        goToScreen('screen-wrong');
      }
    }

    function nextQuestion() {
      currentQuestion++;
      if(currentQuestion < questions.length) {
        goToScreen('screen-quiz');
        loadQuestion();
      } else {
        goToScreen('screen-win');
      }
    }

    function retryQuestion() {
      goToScreen('screen-quiz');
      loadQuestion();
    }
  </script>
</body>
</html>
