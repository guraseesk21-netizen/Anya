<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anya's Quiz 🥜</title>
  <!-- Font Tondo e Carino da Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif !important;
    }

    /* Impedisce lo scroll della pagina su mobile */
    html, body {
      height: 100%;
      max-height: 100vh;
      overflow: hidden;
      background: #ffebee;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 5px;
      position: relative;
    }

    /* SFONDO ARACHIDI DECORATIVE CON ANIMAZIONE FLUTTUANTE */
    .bg-peanut {
      position: absolute;
      width: 55px;
      height: auto;
      opacity: 0.18 !important;
      pointer-events: none;
      z-index: 1;
      animation: floatBg 4s ease-in-out infinite alternate;
    }

    @keyframes floatBg {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(5deg); }
    }

    .p-1  { top: 2%; left: 3%; animation-delay: 0s; }
    .p-2  { top: 5%; right: 4%; animation-delay: 0.5s; }
    .p-3  { top: 22%; right: 2%; animation-delay: 1s; }
    .p-4  { top: 38%; left: 2%; animation-delay: 1.5s; }
    .p-5  { top: 55%; right: 3%; animation-delay: 0.2s; }
    .p-6  { bottom: 22%; left: 3%; animation-delay: 0.8s; }
    .p-7  { bottom: 10%; right: 4%; animation-delay: 1.2s; }
    .p-8  { bottom: 2%; left: 8%; animation-delay: 1.7s; }
    .p-9  { bottom: 2%; right: 20%; animation-delay: 0.4s; }
    .p-10 { top: 15%; left: 5%; animation-delay: 0.9s; }

    /* Container Principale */
    .game-card {
      position: relative;
      z-index: 10;
      background: transparent;
      width: 100%;
      max-width: 380px;
      height: 96dvh;
      padding: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* BOTTONE MUSICA IN ALTO A DESTRA */
    .music-btn {
      position: absolute;
      top: 0px;
      right: 5px;
      z-index: 30;
      background: #ff85a2 !important;
      color: #ffffff !important;
      border: 2px solid #ffffff !important;
      border-radius: 50% !important;
      width: 42px !important;
      height: 42px !important;
      font-size: 1.3rem !important;
      font-weight: bold !important;
      cursor: pointer;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      line-height: 1 !important;
      padding: 0 !important;
      box-shadow: 0 3px 8px rgba(255, 133, 162, 0.4);
      transition: opacity 0.2s ease, transform 0.2s ease;
      opacity: 0.5;
    }

    .music-btn:active {
      transform: scale(0.9);
    }

    /* LOGO GIGANTE */
    .header-logo {
      width: 100%;
      text-align: center;
      margin-top: 15px;
      margin-bottom: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-logo img.logo-img {
      width: 100%;
      max-width: 380px;
      height: auto;
      max-height: 180px;
      object-fit: contain;
      transform: scale(1.4);
      background: transparent;
      border: none;
    }

    /* Pagine del gioco con Animazione Fade-In */
    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      text-align: center;
    }

    .screen.active {
      display: flex;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Pulsante Generico Chiaro */
    .play-btn-fallback {
      background: #ff9ebb !important;
      color: white;
      border: 2px solid #ff85a2;
      padding: 10px 32px;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 158, 187, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .play-btn-fallback:active {
      transform: scale(0.95);
    }

    /* Box di testo Intro */
    .intro-text-box {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #ffccd5;
      border-radius: 16px;
      padding: 12px;
      font-size: 0.88rem;
      color: #555;
      margin-bottom: 12px;
    }

    /* Griglia Risposte A B C D */
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-bottom: 10px;
    }

    .answer-btn {
      background: #ffffff;
      border: 2px solid #ffccd5;
      border-radius: 12px;
      padding: 10px 5px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #ff6584;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .answer-btn:active {
      transform: scale(0.96);
      background: #ffe3e8;
    }

    /* Dialogue Wrapper */
    .dialogue-wrapper {
      display: flex;
      align-items: center; 
      gap: 8px;
      width: 100%;
    }

    /* ANYA CHE PARLA */
    .anya-avatar-standalone {
      width: 105px;
      height: 105px;
      object-fit: contain;
      background: transparent;
      border: none;
      flex-shrink: 0;
    }

    /* Fumetto */
    .speech-bubble-standalone {
      position: relative;
      background: #ffffff;
      border: 2px solid #ffccd5;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #444;
      text-align: left;
      line-height: 1.3;
      box-shadow: 0 4px 12px rgba(220, 120, 150, 0.12);
      flex-grow: 1;
    }

    /* Freccia del Fumetto */
    .speech-bubble-standalone::after {
      content: '';
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 6px 8px 6px 0;
      border-style: solid;
      border-color: transparent #ffffff transparent transparent;
    }

    /* Immagini di feedback */
    .feedback-img {
      width: 160px;
      height: auto;
      max-height: 180px;
      object-fit: contain;
      margin: 12px 0;
      background: transparent;
      border: none;
      border-radius: 12px;
    }

    /* Layout per le due immagini nella finale */
    .final-reward-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      width: 100%;
    }

    .final-reward-container img {
      width: 130px;
      height: auto;
      max-height: 140px;
      object-fit: contain;
      background: transparent;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- SFONDO ARACHIDI DECORATIVE -->
  <img src="Arachide.png" class="bg-peanut p-1" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-2" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-3" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-4" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-5" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-6" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-7" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-8" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-9" alt="Arachide BG">
  <img src="Arachide.png" class="bg-peanut p-10" alt="Arachide BG">

  <div class="game-card">

    <!-- BOTTONE MUSICA IN ALTO -->
    <button class="music-btn" id="music-toggle-btn" onclick="toggleAudio()">♪</button>

    <!-- LOGO GIGANTE -->
    <div class="header-logo">
      <img src="logo.png" class="logo-img" alt="Logo" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
      <h1 id="alt-title" style="display:none; color:#ff85a2; font-size:2.2rem;">Anya's Quiz</h1>
    </div>

    <!-- ================= SCHERMATA 1: START ================= -->
    <div id="screen-start" class="screen active">
      <img src="Anya_aracidi.png" style="width: 140px; height: auto;" alt="Anya Arachide">
      <button class="play-btn-fallback" onclick="startIntro()">INIZIA</button>
    </div>

    <!-- ================= SCHERMATA 2: INTRO ================= -->
    <div id="screen-intro" class="screen">
      <img src="Anya1.png" style="width: 130px; height: auto;" alt="Anya 1" onerror="this.src='anya_happy.png';">
      <div class="intro-text-box">
        Waku Waku! Aiuta Anya a rispondere correttamente a tutte e 10 le domande per conquistarne il premio finale! 🥜
      </div>
      <button class="play-btn-fallback" style="font-size: 0.95rem; padding: 8px 24px;" onclick="startGame()">Via!</button>
    </div>

    <!-- ================= SCHERMATA 3: DOMANDE ================= -->
    <div id="screen-quiz" class="screen">
      <!-- Risposte -->
      <div class="answers-grid">
        <button class="answer-btn" onclick="checkAnswer(0)">A: <span id="opt-0"></span></button>
        <button class="answer-btn" onclick="checkAnswer(1)">B: <span id="opt-1"></span></button>
        <button class="answer-btn" onclick="checkAnswer(2)">C: <span id="opt-2"></span></button>
        <button class="answer-btn" onclick="checkAnswer(3)">D: <span id="opt-3"></span></button>
      </div>

      <!-- Anya che parla + Fumetto -->
      <div class="dialogue-wrapper">
        <img id="anya-expression" src="anya_talking.png" class="anya-avatar-standalone" alt="Anya">
        <div class="speech-bubble-standalone" id="question-text">Caricamento...</div>
      </div>
    </div>

    <!-- ================= SCHERMATA 4: RISPOSTA CORRETTA ================= -->
    <div id="screen-correct" class="screen">
      <h3 style="color: #4caf50;">Risposta Corretta! ✨</h3>
      <img id="correct-char-img" src="" class="feedback-img" alt="Personaggio" onerror="this.src='anya_happy.png';">
      <button class="play-btn-fallback" style="font-size: 0.85rem; padding: 8px 20px; margin-top: 5px;" onclick="nextQuestion()">Prossima</button>
    </div>

    <!-- ================= SCHERMATA 5: RISPOSTA SBAGLIATA ================= -->
    <div id="screen-wrong" class="screen">
      <h3 style="color: #ff6584; font-size: 1.15rem;">Sbagliato... Riprova per Anya! 😭</h3>
      <img src="anya_crying.png" class="feedback-img" alt="Anya Piange">
      <button class="play-btn-fallback" style="font-size: 0.85rem; padding: 8px 20px; margin-top: 5px;" onclick="retryQuestion()">Riprova</button>
    </div>

    <!-- ================= SCHERMATA 6: VITTORIA FINALE ================= -->
    <div id="screen-win" class="screen">
      <h3 style="color: #ff85a2;">Vittoria! 🎉</h3>
      <p style="font-size: 0.85rem; color: #555; margin-top: 3px;">Hai superato tutte le 10 domande!</p>
      
      <!-- CONTENITORE PER LE 2 IMMAGINI FINALI -->
      <div class="final-reward-container">
        <img src="Premio.jpg" alt="Premio Pacchetto Arachidi" onerror="this.src='Arachide.png';">
        <img src="Anya_fine.gif" alt="Anya Festeggia" onerror="this.style.display='none';">
      </div>

      <p style="font-size: 0.9rem; font-weight: bold; color: #d97706;">Hai vinto il premio!</p>
      <button class="play-btn-fallback" style="margin-top: 10px; font-size: 0.85rem; padding: 8px 20px;" onclick="goToScreen('screen-start')">Rigioca</button>
    </div>

  </div>

  <!-- AUDIO DELLA CANZONE -->
  <audio id="bg-music" src="Song.mp3" loop autoplay></audio>

  <script>
    const questions = [
      { question: "Qual è il cibo preferito di Anya?", options: ["Carote", "Arachidi", "Cioccolato", "Torta"], correct: 1, image: "d0a517642140232317871409ae0ea77d.jpg" },
      { question: "Come si chiama il cane dei Forger?", options: ["Bond", "Max", "Peanut", "Loid"], correct: 0, image: "Dog.jpg" },
      { question: "Qual è il potere di Anya?", options: ["Super forza", "Sa volare", "Legge la mente", "Invisibilità"], correct: 2, image: "Poteri.jpg" },
      { question: "Come si chiama la scuola di Anya?", options: ["UA Academy", "Eden Academy", "Ouka Academy", "PK Academy"], correct: 1, image: "Eden_academy.jpg" },
      { question: "Nome in codice di Loid?", options: ["Thorn Princess", "Scruffy", "Twilight", "Daybreak"], correct: 2, image: "Spy.jpg" },
      { question: "Colore capelli di Anya?", options: ["Biondi", "Rosa", "Neri", "Castani"], correct: 1, image: "Capelli.png" },
      { question: "Cosa vuole collezionare Anya?", options: ["Stelle Stella", "Medaglie", "Punti premio", "Peluche"], correct: 0, image: "Stella.png" },
      { question: "Migliore amica di Anya?", options: ["Yor", "Fiona", "Becky", "Camilla"], correct: 2, image: "Friend.jpg" },
      { question: "Cosa dice Anya quando è entusiasta?", options: ["Nani?!", "Waku Waku!", "Sugoi!", "Baka!"], correct: 1, image: "anya-wakuwaku.png" },
      { question: "Come chiama Anya suo padre?", options: ["Papà", "Chichi", "Loid", "Signore"], correct: 1, image: "Chichi.jpg" }
    ];

    const defaultHappyImage = "Anya1.png";

    let currentQuestion = 0;
    let isMusicPlaying = false;
    const bgMusic = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle-btn');

    function playAudio() {
      bgMusic.play().then(() => {
        isMusicPlaying = true;
        musicBtn.style.opacity = "1";
      }).catch(() => {
        isMusicPlaying = false;
        musicBtn.style.opacity = "0.4";
      });
    }

    window.addEventListener('load', () => {
      playAudio();
    });

    const handleFirstTouch = () => {
      if (!isMusicPlaying) playAudio();
      document.removeEventListener('click', handleFirstTouch);
      document.removeEventListener('touchstart', handleFirstTouch);
    };
    document.addEventListener('click', handleFirstTouch);
    document.addEventListener('touchstart', handleFirstTouch);

    function toggleAudio() {
      if (isMusicPlaying) {
        bgMusic.pause();
        isMusicPlaying = false;
        musicBtn.style.opacity = "0.4";
      } else {
        playAudio();
      }
    }

    function goToScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startIntro() {
      if (!isMusicPlaying) playAudio();
      goToScreen('screen-intro');
    }

    function startGame() {
      currentQuestion = 0;
      goToScreen('screen-quiz');
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question-text').textContent = q.question;
      for(let i = 0; i < 4; i++) {
        document.getElementById(`opt-${i}`).textContent = q.options[i];
      }
      document.getElementById('anya-expression').src = "anya_talking.png";
    }

    function checkAnswer(selectedIndex) {
      const q = questions[currentQuestion];
      if(selectedIndex === q.correct) {
        const feedbackImg = document.getElementById('correct-char-img');
        feedbackImg.src = q.image ? q.image : defaultHappyImage;
        goToScreen('screen-correct');
      } else {
        goToScreen('screen-wrong');
      }
    }

    function nextQuestion() {
      currentQuestion++;
      if(currentQuestion < questions.length) {
        goToScreen('screen-quiz');
        loadQuestion();
      } else {
        goToScreen('screen-win');
      }
    }

    function retryQuestion() {
      goToScreen('screen-quiz');
      loadQuestion();
    }
  </script>
</body>
</html>
