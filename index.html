<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anya's Quiz Game 🥜</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffe4e8;
      background-image: radial-gradient(#ffb6c1 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      padding: 15px;
    }

    /* Container Principale (Schermo del gioco) */
    .game-card {
      position: relative;
      background: rgba(255, 255, 255, 0.95);
      width: 100%;
      max-width: 350px;
      min-height: 580px;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(220, 120, 150, 0.3),
                  0 0 0 4px #fff,
                  0 0 0 8px #ffb6c1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Sticker Decorativi */
    .sticker {
      position: absolute;
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      pointer-events: none;
    }

    .sticker-1 { top: 10px; left: 10px; }
    .sticker-2 { top: 10px; right: 10px; }
    .sticker-3 { bottom: 10px; left: 10px; }
    .sticker-4 { bottom: 10px; right: 10px; }

    /* Logo / Titolo in alto */
    .header-logo {
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    .header-logo img {
      max-width: 180px;
      max-height: 60px;
      object-fit: contain;
    }

    /* Gestione Pagine */
    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    .screen.active {
      display: flex;
    }

    /* PAGINA 1: HOME */
    .play-btn-img {
      width: 120px;
      cursor: pointer;
      transition: transform 0.2s ease;
      margin-top: 30px;
    }

    .play-btn-img:hover {
      transform: scale(1.08);
    }

    .play-btn-fallback {
      background: #ff5e83;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 94, 131, 0.4);
    }

    /* PAGINA 2: INTRODUZIONE */
    .intro-text-box {
      background: #fff0f3;
      border: 2px solid #ffb6c1;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 15px;
    }

    .anya-character {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ff7597;
      margin-bottom: 15px;
    }

    /* PAGINA 3: DOMANDE (GRIGLIA RISPOSTE A B C D) */
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-bottom: 10px;
    }

    .answer-btn {
      background: #fff;
      border: 2px solid #ffb6c1;
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ff4d73;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
    }

    .answer-btn:hover {
      background: #ffe6eb;
      transform: translateY(-2px);
    }

    /* TIMER */
    .timer-box {
      font-size: 0.85rem;
      font-weight: bold;
      color: #d97706;
      background: #fff3d1;
      padding: 4px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    /* SEZIONE IN BASSO: ANYA + FUMETTO */
    .dialogue-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: #fff5f7;
      border: 2px dashed #ffb6c1;
      border-radius: 15px;
      padding: 10px;
    }

    .anya-avatar {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #ff5e83;
      flex-shrink: 0;
    }

    .speech-bubble {
      font-size: 0.85rem;
      color: #444;
      line-height: 1.2;
    }

    /* SCHERMATA FINALE / PREMIO */
    .reward-img {
      width: 150px;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div class="game-card">

    <!-- Header sempre visibile con Logo/Titolo -->
    <div class="header-logo">
      <!-- Sostituisci logo.png con l'immagine creata su Ibis Paint -->
      <img src="logo.png" alt="Logo Gioco" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
      <h2 id="alt-title" style="display:none; color:#ff5e83;">Anya's Quiz 🥜</h2>
    </div>

    <!-- Sticker d'angolo opzionali -->
    <img src="sticker1.png" class="sticker sticker-1" alt="" onerror="this.style.display='none'">
    <img src="sticker2.png" class="sticker sticker-2" alt="" onerror="this.style.display='none'">

    <!-- ================= SCHERMATA 1: START ================= -->
    <div id="screen-start" class="screen active">
      <p style="color: #888; font-size: 0.9rem; margin-top: 40px;">Benvenuto nel mini gioco!</p>
      
      <!-- Tasto Play fatto con Ibis Paint -->
      <img src="play_button.png" class="play-btn-img" alt="Play" onclick="goToScreen('screen-intro')" onerror="this.style.display='none'; document.getElementById('fallback-play').style.display='block';">
      <button id="fallback-play" class="play-btn-fallback" style="display:none;" onclick="goToScreen('screen-intro')">PLAY ▶</button>
    </div>

    <!-- ================= SCHERMATA 2: INTRO ================= -->
    <div id="screen-intro" class="screen">
      <img src="anya_happy.png" class="anya-character" alt="Anya" onerror="this.src='https://via.placeholder.com/140/ffb6c1/ffffff?text=Anya'">
      
      <div class="intro-text-box">
        Waku Waku! Aiuta Anya a rispondere a 10 domande per vincere il premio finale! 🥜
      </div>

      <button class="play-btn-fallback" style="font-size: 1rem; padding: 10px 25px;" onclick="startGame()">Inizia il Quiz!</button>
    </div>

    <!-- ================= SCHERMATA 3: DOMANDE ================= -->
    <div id="screen-quiz" class="screen">
      
      <!-- Risposte A B C D -->
      <div class="answers-grid">
        <button class="answer-btn" onclick="checkAnswer(0)">A: <span id="opt-0">Opzione A</span></button>
        <button class="answer-btn" onclick="checkAnswer(1)">B: <span id="opt-1">Opzione B</span></button>
        <button class="answer-btn" onclick="checkAnswer(2)">C: <span id="opt-2">Opzione C</span></button>
        <button class="answer-btn" onclick="checkAnswer(3)">D: <span id="opt-3">Opzione D</span></button>
      </div>

      <!-- Timer Facoltativo -->
      <div class="timer-box">⏱ Tempo: <span id="timer-count">15</span>s</div>

      <!-- Anya in basso con il fumetto della domanda -->
      <div class="dialogue-container">
        <img id="anya-expression" src="anya_talking.png" class="anya-avatar" alt="Anya" onerror="this.src='https://via.placeholder.com/65/ffb6c1/ffffff?text=Anya'">
        <div class="speech-bubble" id="question-text">
          Caricamento domanda...
        </div>
      </div>

    </div>

    <!-- ================= SCHERMATA 4: VITTORIA ================= -->
    <div id="screen-win" class="screen">
      <h3 style="color: #ff5e83;">Complimenti! 🎉</h3>
      <p style="font-size: 0.85rem; color: #555; margin-top: 5px;">Hai superato tutte le domande!</p>
      
      <img src="arachidi.png" class="reward-img" alt="Pacchetto Arachidi" onerror="this.src='https://via.placeholder.com/150/fef3c7/d97706?text=🥜+Arachidi!'">
      
      <p style="font-size: 0.9rem; font-weight: bold; color: #d97706;">Hai vinto un pacchetto di arachidi!</p>
      
      <button class="play-btn-fallback" style="margin-top: 15px; font-size: 0.9rem; padding: 10px 20px;" onclick="goToScreen('screen-start')">Gioca Ancora</button>
    </div>

  </div>

  <script>
    // 10 DOMANDE DEL QUIZ (Puoi modificare il testo e le opzioni qui)
    const questions = [
      {
        question: "Qual è il cibo preferito in assoluto di Anya?",
        options: ["Carote", "Arachidi", "Cioccolato", "Torta"],
        correct: 1
      },
      {
        question: "Come si chiama il cane della famiglia Forger?",
        options: ["Bond", "Max", "Peanut", "Loid"],
        correct: 0
      },
      {
        question: "Qual è il potere segreto di Anya?",
        options: ["Leggere il pensiero", "Invisibilità", "Super forza", "Volare"],
        correct: 0
      },
      {
        question: "Come si chiama la scuola frequentata da Anya?",
        options: ["O连续", "Eden Academy", "UA Academy", "PK Academy"],
        correct: 1
      },
      {
        question: "Qual è il nome in codice di Loid Forger?",
        options: ["Thorn Princess", "Twilight", "Scruffy", "Daybreak"],
        correct: 1
      },
      {
        question: "Qual è il colore dei capelli di Anya?",
        options: ["Biondi", "Neri", "Rosa", "Castani"],
        correct: 2
      },
      {
        question: "Cosa vuole ottenere Anya per rendere fiero Loid?",
        options: ["Stella Stella", "Medaglia d'oro", "Dolci", "Un peluche"],
        correct: 0
      },
      {
        question: "Come si chiama la migliore amica di Anya a scuola?",
        options: ["Yor", "Becky", "Fiona", "Damian"],
        correct: 1
      },
      {
        question: "Qual è la parola famosa che dice Anya quando è entusiasta?",
        options: ["Nani!", "Waku Waku!", "Sugoi!", "Baka!"],
        correct: 1
      },
      {
        question: "Come chiama Anya suo padre Loid?",
        options: ["Papà", "Chichi", "Loid", "Master"],
        correct: 1
      }
    ];

    let currentQuestion = 0;
    let timer;
    let timeLeft = 15;

    function goToScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startGame() {
      currentQuestion = 0;
      goToScreen('screen-quiz');
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question-text').textContent = q.question;
      
      // Carica opzioni
      for(let i = 0; i < 4; i++) {
        document.getElementById(`opt-${i}`).textContent = q.options[i];
      }

      // Reset Espressione Anya
      document.getElementById('anya-expression').src = "anya_talking.png";

      // Reset Timer
      clearInterval(timer);
      timeLeft = 15;
      document.getElementById('timer-count').textContent = timeLeft;
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer-count').textContent = timeLeft;
        if(timeLeft <= 0) {
          clearInterval(timer);
          showWrongAnswer("Tempo scaduto! Riprova per Anya!");
        }
      }, 1000);
    }

    function checkAnswer(selectedIndex) {
      clearInterval(timer);
      const q = questions[currentQuestion];

      if(selectedIndex === q.correct) {
        // RISPOSTA CORRETTA
        currentQuestion++;
        if(currentQuestion < questions.length) {
          loadQuestion();
        } else {
          goToScreen('screen-win');
        }
      } else {
        // RISPOSTA SBAGLIATA
        showWrongAnswer("Sbagliato... Riprova per Anya! 😭");
      }
    }

    function showWrongAnswer(msg) {
      document.getElementById('question-text').textContent = msg;
      // Mostra Anya che piange
      document.getElementById('anya-expression').src = "anya_crying.png";
    }
  </script>
</body>
</html>
