<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anya's Quiz 🥜</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #ffebee;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 5px;
    }

    /* Container principale */
    .game-card {
      width: 100%;
      max-width: 400px;
      height: 98vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* BARRA SUPERIORE (Logo + Musica) */
    .top-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 5px;
      position: relative;
    }

    /* LOGO INGRANDITO */
    .header-logo {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    .header-logo img.logo-img {
      width: 95%; /* Quasi tutta la larghezza */
      max-width: 500px;
      height: auto;
      object-fit: contain;
    }

    /* BOTTONE MUSICA CENTRATO */
    .music-btn {
      background: #ff85a2;
      color: #ffffff;
      border: 3px solid #ffffff;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(255, 133, 162, 0.5);
      margin-bottom: 15px; /* Spazio sotto */
    }

    /* RESTO DEL LAYOUT */
    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
    }
    .screen.active { display: flex; }

    .anya-peanut-hero { width: 160px; height: auto; }
    .play-btn-fallback {
      background: #ff9ebb;
      color: white;
      border: 3px solid #ff85a2;
      padding: 12px 35px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 158, 187, 0.4);
      margin-top: 20px;
    }

    .intro-text-box {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #ffccd5;
      border-radius: 20px;
      padding: 15px;
      font-size: 1rem;
      color: #555;
      margin: 15px;
      text-align: center;
    }

    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 90%;
      margin-bottom: 20px;
    }

    .answer-btn {
      background: #ffffff;
      border: 3px solid #ffccd5;
      border-radius: 15px;
      padding: 15px 5px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ff6584;
      cursor: pointer;
    }

    .dialogue-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 95%;
    }

    .anya-avatar-standalone { width: 110px; height: 110px; }
    
    .speech-bubble-standalone {
      background: #ffffff;
      border: 3px solid #ffccd5;
      border-radius: 15px;
      padding: 12px;
      font-size: 0.95rem;
      color: #444;
      line-height: 1.4;
      flex-grow: 1;
    }
  </style>
</head>
<body>

  <div class="game-card">

    <div class="top-bar">
      <!-- LOGO -->
      <div class="header-logo">
        <img src="logo.png" class="logo-img" alt="Logo" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
        <h1 id="alt-title" style="display:none; color:#ff85a2; font-size:2.5rem;">Anya's Quiz</h1>
      </div>
      <!-- MUSICA CENTRATA -->
      <button class="music-btn" id="music-toggle-btn" onclick="toggleAudio()">♪</button>
    </div>

    <!-- START -->
    <div id="screen-start" class="screen active">
      <img src="Anya_aracidi.png" class="anya-peanut-hero" alt="Anya">
      <button class="play-btn-fallback" onclick="startIntro()">INIZIA</button>
    </div>

    <!-- INTRO -->
    <div id="screen-intro" class="screen">
      <div class="intro-text-box">
        Waku Waku! Aiuta Anya a rispondere correttamente a tutte e 10 le domande per conquistare il premio finale! 🥜
      </div>
      <button class="play-btn-fallback" onclick="startGame()">Via!</button>
    </div>

    <!-- QUIZ -->
    <div id="screen-quiz" class="screen">
      <div class="answers-grid">
        <button class="answer-btn" onclick="checkAnswer(0)">A: <span id="opt-0"></span></button>
        <button class="answer-btn" onclick="checkAnswer(1)">B: <span id="opt-1"></span></button>
        <button class="answer-btn" onclick="checkAnswer(2)">C: <span id="opt-2"></span></button>
        <button class="answer-btn" onclick="checkAnswer(3)">D: <span id="opt-3"></span></button>
      </div>
      <div class="dialogue-wrapper">
        <img id="anya-expression" src="anya_talking.png" class="anya-avatar-standalone" alt="Anya">
        <div class="speech-bubble-standalone" id="question-text">Caricamento...</div>
      </div>
    </div>

    <!-- RISULTATI -->
    <div id="screen-win" class="screen">
      <h2 style="color: #ff85a2;">Vittoria! 🎉</h2>
      <button class="play-btn-fallback" onclick="location.reload()">Rigioca</button>
    </div>
  </div>

  <audio id="bg-music" src="relax_music.mp3" loop></audio>

  <script>
    const questions = [
      { question: "Qual è il cibo preferito di Anya?", options: ["Carote", "Arachidi 🥜", "Cioccolato", "Torta"], correct: 1 },
      { question: "Come si chiama il cane dei Forger?", options: ["Bond 🐶", "Max", "Peanut", "Loid"], correct: 0 },
      { question: "Qual è il potere di Anya?", options: ["Super forza", "Sa volare", "Legge la mente 🧠", "Invisibilità"], correct: 2 },
      { question: "Come si chiama la scuola di Anya?", options: ["UA Academy", "Eden Academy 🏫", "Ouka Academy", "PK Academy"], correct: 1 },
      { question: "Nome in codice di Loid?", options: ["Thorn Princess", "Scruffy", "Twilight 🕵️‍♂️", "Daybreak"], correct: 2 },
      { question: "Colore capelli di Anya?", options: ["Biondi", "Rosa 💖", "Neri", "Castani"], correct: 1 },
      { question: "Cosa vuole collezionare Anya?", options: ["Stelle Stella ⭐", "Medaglie", "Punti premio", "Peluche"], correct: 0 },
      { question: "Migliore amica di Anya?", options: ["Yor", "Fiona", "Becky 🎀", "Camilla"], correct: 2 },
      { question: "Cosa dice Anya quando è entusiasta?", options: ["Nani?!", "Waku Waku! ✨", "Sugoi!", "Baka!"], correct: 1 },
      { question: "Come chiama Anya suo padre?", options: ["Papà", "Chichi 👨‍👧", "Loid", "Signore"], correct: 1 }
    ];

    let currentQuestion = 0;
    let isMusicPlaying = false;
    const bgMusic = document.getElementById('bg-music');

    function toggleAudio() {
      if (isMusicPlaying) { bgMusic.pause(); isMusicPlaying = false; } 
      else { bgMusic.play().catch(() => {}); isMusicPlaying = true; }
    }

    function startIntro() { document.getElementById('screen-start').classList.remove('active'); document.getElementById('screen-intro').classList.add('active'); }
    function startGame() { document.getElementById('screen-intro').classList.remove('active'); document.getElementById('screen-quiz').classList.add('active'); loadQuestion(); }
    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question-text').textContent = q.question;
      q.options.forEach((opt, i) => document.getElementById(`opt-${i}`).textContent = opt);
    }
    function checkAnswer(idx) {
      if(idx === questions[currentQuestion].correct) {
        currentQuestion++;
        if(currentQuestion < questions.length) loadQuestion();
        else document.getElementById('screen-quiz').classList.remove('active'), document.getElementById('screen-win').classList.add('active');
      } else alert("Riprova! 🥜");
    }
  </script>
</body>
</html>
