<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anya's Music Player 🥜</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('0a2bf83cc0d4041dd33ebb5c83ed8666.jpg') repeat center center;
      background-size: 200px;
      padding: 30px 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* Overlay per ammorbidire lo sfondo */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 240, 245, 0.45);
      z-index: 0;
    }

    /* Card del Player Musicale - Dimensioni Ridotte */
    .player-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 290px;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(220, 120, 150, 0.25),
                  0 0 0 3px #fff,
                  0 0 0 6px #ffd1dc;
      text-align: center;
      margin: 20px 0;
    }

    /* Sticker Decorativi attorno alla card - Posizionati meglio e più compatti */
    .sticker {
      position: absolute;
      z-index: 15;
      pointer-events: none;
      filter: drop-shadow(2px 3px 5px rgba(0,0,0,0.2));
      animation: float 3s ease-in-out infinite alternate;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .sticker-top-right {
      width: 55px;
      height: 55px;
      object-fit: cover;
      top: -22px;
      right: -15px;
    }

    .sticker-bottom-left {
      width: 58px;
      height: 58px;
      object-fit: cover;
      bottom: -22px;
      left: -18px;
      animation-delay: 1.5s;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(-3deg); }
      100% { transform: translateY(-6px) rotate(4deg); }
    }

    /* Copertina della canzone ridimensionata */
    .cover-container {
      width: 170px;
      height: 170px;
      margin: 0 auto 14px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.12);
      border: 3px solid #ffb6c1;
      position: relative;
    }

    .cover-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .cover-container img.playing {
      transform: scale(1.04);
    }

    /* Info Canzone */
    .song-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ff5e83;
      margin-bottom: 3px;
    }

    .song-artist {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 14px;
    }

    /* Barra di Avanzamento */
    .progress-container {
      width: 100%;
      margin-bottom: 12px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #ffe4e8;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff9a9e, #fecfef);
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #aaa;
      margin-top: 5px;
      font-weight: 600;
    }

    /* Controlli compatti */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 8px;
    }

    .btn {
      background: #fff;
      border: 2px solid #ffd1dc;
      color: #ff5e83;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 3px 8px rgba(255, 182, 193, 0.3);
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.92);
    }

    .btn-skip {
      width: 40px;
      height: 40px;
      font-size: 0.95rem;
    }

    .btn-play {
      width: 52px;
      height: 52px;
      font-size: 1.25rem;
      background: #ff7597;
      color: white;
      border: none;
      box-shadow: 0 5px 12px rgba(255, 117, 151, 0.4);
    }

    .btn-play:hover {
      background: #ff5e83;
      transform: scale(1.05);
    }

    .peanut-badge {
      display: inline-block;
      margin-top: 12px;
      background: #fff3d1;
      color: #d97706;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Card del Player -->
  <div class="player-card">
    
    <!-- Sticker Decorativi -->
    <img src="0c6d17c99428075236694e6db7dc5364.jpg" class="sticker sticker-top-right" alt="Anya Sticker 1">
    <img src="3037d58795e47872235ce21b53c8d9fc.jpg" class="sticker sticker-bottom-left" alt="Anya Sticker 2">

    <!-- Copertina -->
    <div class="cover-container">
      <img id="cover" src="5b214622e3478e50a8f223cf8ccc1076.jpg" alt="Anya Cover">
    </div>

    <!-- Info Brano -->
    <div class="song-title" id="title">Mixed Nuts</div>
    <div class="song-artist" id="artist">Official HIGE DANdism</div>

    <!-- Barra Musica -->
    <div class="progress-container">
      <div class="progress-bar-bg" id="progress-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="time-stamps">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Controlli -->
    <div class="controls">
      <button class="btn btn-skip" id="prev-btn">⏮</button>
      <button class="btn btn-play" id="play-btn">▶</button>
      <button class="btn btn-skip" id="next-btn">⏭</button>
    </div>

    <div class="peanut-badge">Anya Likes Peanuts! 🥜</div>
  </div>

  <audio id="audio"></audio>

  <script>
    const playlist = [
      {
        title: "Mixed Nuts",
        artist: "Official HIGE DANdism",
        cover: "5b214622e3478e50a8f223cf8ccc1076.jpg",
        src: "canzone1.mp3"
      },
      {
        title: "Souvenir",
        artist: "BUMP OF CHICKEN",
        cover: "bec9f3b0f76b2e25f5d01423abcd30d8.jpg",
        src: "canzone2.mp3"
      },
      {
        title: "Kiseki",
        artist: "SPY x FAMILY OST",
        cover: "d0a517642140232317871409ae0ea77d.jpg",
        src: "canzone3.mp3"
      },
      {
        title: "Comedy",
        artist: "Gen Hoshino",
        cover: "d324bd5f968e5c06fa3a748b2d73ae09.jpg",
        src: "canzone4.mp3"
      }
    ];

    let songIndex = 0;
    let isPlaying = false;

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const cover = document.getElementById('cover');
    const progressFill = document.getElementById('progress-fill');
    const progressBg = document.getElementById('progress-bg');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');

    function loadSong(song) {
      title.textContent = song.title;
      artist.textContent = song.artist;
      cover.src = song.cover;
      audio.src = song.src;
    }

    function playSong() {
      isPlaying = true;
      playBtn.textContent = '⏸';
      cover.classList.add('playing');
      audio.play().catch(() => {});
    }

    function pauseSong() {
      isPlaying = false;
      playBtn.textContent = '▶';
      cover.classList.remove('playing');
      audio.pause();
    }

    playBtn.addEventListener('click', () => {
      isPlaying ? pauseSong() : playSong();
    });

    nextBtn.addEventListener('click', () => {
      songIndex = (songIndex + 1) % playlist.length;
      loadSong(playlist[songIndex]);
      playSong();
    });

    prevBtn.addEventListener('click', () => {
      songIndex = (songIndex - 1 + playlist.length) % playlist.length;
      loadSong(playlist[songIndex]);
      playSong();
    });

    audio.addEventListener('timeupdate', (e) => {
      const { duration, currentTime } = e.srcElement;
      if (duration) {
        const progressPercent = (currentTime / duration) * 100;
        progressFill.style.width = `${progressPercent}%`;

        const currentMin = Math.floor(currentTime / 60);
        const currentSec = Math.floor(currentTime % 60);
        currentTimeEl.textContent = `${currentMin}:${currentSec < 10 ? '0' : ''}${currentSec}`;

        const durationMin = Math.floor(duration / 60);
        const durationSec = Math.floor(duration % 60);
        durationEl.textContent = `${durationMin}:${durationSec < 10 ? '0' : ''}${durationSec}`;
      }
    });

    progressBg.addEventListener('click', (e) => {
      const width = progressBg.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      if (duration) {
        audio.currentTime = (clickX / width) * duration;
      }
    });

    audio.addEventListener('ended', () => {
      songIndex = (songIndex + 1) % playlist.length;
      loadSong(playlist[songIndex]);
      playSong();
    });

    loadSong(playlist[songIndex]);
  </script>
</body>
</html>
